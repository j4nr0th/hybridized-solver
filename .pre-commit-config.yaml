# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v21.1.6"
    hooks:
      - id: clang-format
        args: ["--style=Microsoft", "-i"]
        # CMakeLists.txt is not C++, and formatting it as such mangles it.
        types_or: [c, c++]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.7
    hooks:
      # Run the linter.
      - id: ruff
      # Run the formatter.
      - id: ruff-format
  # - repo: https://github.com/codespell-project/codespell
  #   rev: v2.2.4
  #   hooks:
  #     - id: codespell
  #       additional_dependencies:
  #         - tomli
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "0.0.1" # Use the sha / tag you want to point at
    hooks:
      - id: pyrefly-typecheck-specific-version
        name: Pyrefly (type checking)
        pass_filenames: true
        # Match [tool.pyrefly]. Passing filenames overrides project-includes,
        # so without this the hook would also check the tests, which the
        # project config deliberately leaves out.
        files: ^python/hybsol/
        additional_dependencies:
          ["pyrefly==0.29.2", "numpy>=2.0.0", "pytest==9.0.1"]
